<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CommitCraft — Perfect Commits, Instantly</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>CommitCraft</h1>
            <p>Paste your git diff or describe your changes to get a perfect commit message.</p>
        </header>

        <main>
            <div class="input-group">
                <textarea id="diffInput" placeholder="Paste git diff or change description here..." rows="10"></textarea>
                <button id="generateBtn">Generate Commit Message</button>
            </div>

            <div id="resultArea" class="result-area hidden">
                <h3>Suggested Commit Message:</h3>
                <div class="result-box">
                    <code id="commitOutput"></code>
                    <button id="copyBtn">Copy</button>
                </div>
            </div>

            <div id="loading" class="hidden">Crafting your message...</div>
            <div id="error" class="hidden"></div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
